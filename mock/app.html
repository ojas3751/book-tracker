<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本棚 - book-tracker モック</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 表示の色の設定を、画面が出る前に当てる（自動のときは端末の設定に任せる）
    try { const t = localStorage.getItem('mock.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* 何もしない */ }
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="メニュー"></aside>
    <div id="drawer-backdrop" data-action="drawer-close"></div>
    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <main id="main"></main>
    </div>
  </div>
  <div id="sheet-backdrop" data-action="close-top"></div>
  <div id="layers"></div>
  <div id="dialog" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
